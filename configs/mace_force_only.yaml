schema_version: 1
seed: 123
structures: null
batch_size: 4
dtype: float32
device: cpu
epochs: 30
learning_rate: 0.0001
checkpoint_every: 1

backbone:
  name: mace
  implementation: official
  checkpoint: models/official/mace/small.model

dataset:
  path: data/simulation/train-forces.jsonl
  bindings:
    forces:
      key: forces
      unit: eV/angstrom

task:
  kind: forcefield
  supervised_outputs: [forces]
