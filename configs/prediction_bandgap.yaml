schema_version: 1
seed: 123
structures: null
batch_size: 32
dtype: float32
device: cpu
epochs: 30
learning_rate: 0.001
checkpoint_every: 1
backbone:
  name: alignn
  implementation: official
  feature_dim: 256
dataset:
  path: data/acceptance/bandgap-10.json
  bindings:
    bandgap: {key: optb88vdw_bandgap, unit: eV}
task: {kind: supervised, property: bandgap}
prediction:
  version: 1
  readout:
    name: graph_mlp
    pooling: mean
    hidden_features: [128, 64]
    activation: silu
optimization: {train_backbone: true, train_readout: true}
