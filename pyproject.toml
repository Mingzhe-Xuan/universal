[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-gnn-tasks"
version = "0.1.0"
description = "Output-driven atomistic GNN tasks with invariant and equivariant backbones"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "e3nn>=0.4.4,<0.6", "ase>=3.22"]

[project.optional-dependencies]
mace = ["mace-torch==0.3.16"]
nequip = ["nequip==0.14.0"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
ugnn = "universal_gnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
